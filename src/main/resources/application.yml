server:
  address: 0.0.0.0
  port: 8080

spring:
  application:
    name: monitoring-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/monitoring}
    username: ${SPRING_DATASOURCE_USERNAME:monitoring}
    password: ${SPRING_DATASOURCE_PASSWORD:monitoring}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  flyway:
    enabled: true

monitoring:
  prometheus:
    # UI: http://<vm>:9090/  →  API всегда с суффиксом /api/v1
    url: ${MONITORING_PROMETHEUS_URL:http://localhost:9090/api/v1}
  alert-evaluation:
    enabled: true
    # prometheus — алерты из GET /api/v1/rules?type=alert; database — правила в таблице alert_rules
    source: prometheus
    interval-ms: 1000
    default-notify-engineer-id: 2
  site:
    address: ${MONITORING_SITE_ADDRESS:Талдомская 17к1}
  terminal:
    secret-key: ${TERMINAL_SECRET_KEY:change-terminal-key-dev}
    host-key-policy: accept-all
    connect-timeout-ms: 15000
    max-sessions-per-user: 3
  tracker:
    enabled: ${TRACKER_ENABLED:false}
    oauth-token: ${TRACKER_OAUTH_TOKEN:}
    cloud-org-id: ${TRACKER_CLOUD_ORG_ID:}
    queue: ${TRACKER_QUEUE:MONITORING}
    base-url: https://api.tracker.yandex.net
    # Ключи статусов workflow очереди (Настройки → Рабочий процесс)
    status-in-progress: ${TRACKER_STATUS_IN_PROGRESS:inProgress}
    status-closed: ${TRACKER_STATUS_CLOSED:closed}
    resolution-closed: ${TRACKER_RESOLUTION_CLOSED:fixed}

jwt:
  secret: change-me
  expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    org.springframework.jdbc.core: DEBUG
